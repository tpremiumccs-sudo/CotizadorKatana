name: CI

# Hoy el servidor de la agencia compila su propia imagen (repositorio privado,
# sin registro de por medio). Aquí se compila también, en TODAS las ramas y sin
# publicar: es la única forma de enterarse de que el Dockerfile está roto sin
# gastar 20 minutos de un servidor de 2 vCPU para descubrirlo.
#
# El job `imagen`, que sí publica en GHCR, sólo corre en `main`. El día que se
# ponga `APP_IMAGE` en el .env del servidor, éste dejará de compilar y hará
# `pull`.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: katana
          POSTGRES_PASSWORD: katana_ci
          POSTGRES_DB: katana
          POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U katana -d katana"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://katana:katana_ci@localhost:5432/katana?schema=public
      APP_PUBLIC_URL: http://127.0.0.1:3210
      SEED_ADMIN_EMAIL: ci@katanatalent.com
      SEED_ADMIN_NOMBRE: CI
      SEED_ADMIN_PASSWORD: una frase larga para integracion
      E2E_PORT: '3210'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Las fuentes del documento vienen del sistema, no de npm: sin ellas el
      # PDF no reproduce las métricas de Helvetica.
      - name: Fuentes del documento
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-urw-base35
          fc-cache -f

      - name: Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm run test:unit

      - name: Pruebas de integración
        run: npm run test:integracion

      # El oráculo de fidelidad compara contra el PDF original con pdfplumber.
      # `tools/calibrar.py` necesita fontTools y brotli, no sólo pdfplumber:
      # las fuentes son .woff2 y fontTools no las abre sin brotli. La lista
      # correcta ya estaba en tools/requirements.txt; el workflow no la usaba,
      # y por eso las tres ejecuciones de CI fallaron en el mismo punto.
      - name: Herramientas de Python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r tools/requirements.txt

      - name: Fidelidad del PDF
        run: npm run test:pdf

      - name: Construir
        run: npm run build:standalone

      - name: Pruebas de extremo a extremo
        run: npm run test:e2e

      - name: Informe de Playwright
        # `if-no-files-found: ignore` porque el fallo puede ocurrir antes de que
        # Playwright llegue a correr, y entonces el directorio no existe.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────
  #  Construir la imagen EN TODAS LAS RAMAS, sin publicarla.
  #
  #  Es la única forma de saber si el Dockerfile compila sin tener un servidor
  #  delante: apt, el repositorio de PostgreSQL, Chromium y las cinco etapas.
  #  Sin esto, el primer intento real de construcción ocurre en el servidor de
  #  la agencia, tras 20 minutos, y falla ahí.
  #
  #  No depende de que las pruebas pasen: si el Dockerfile está roto, quiero
  #  saberlo aunque un test esté en rojo por otra cosa.
  # ───────────────────────────────────────────────────────────────────────
  imagen-prueba:
    name: La imagen construye
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Construir (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: katana/cotizador:prueba
          build-args: |
            APP_PUBLIC_URL=https://ejemplo.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Comprobar que en la imagen está lo que el arranque necesita. Cada uno
      # de estos ficheros faltaba en algún momento y el fallo sólo aparecía al
      # arrancar el contenedor en producción.
      #
      # Dos cosas importan en cómo está escrito:
      #
      #  · La salida del comando que falla SE IMPRIME. La versión anterior la
      #    mandaba a /dev/null, así que cuando el CLI de Prisma no arrancó, lo
      #    único que se supo fue "✗": ni el error ni la traza. Una comprobación
      #    que esconde por qué falló obliga a adivinar a ciegas, y cada intento
      #    cuesta una construcción entera.
      #
      #  · NO se sale en el primer fallo. Se corren todas y se resume al final.
      #    Construir esta imagen son ocho minutos; enterarse de un problema por
      #    vuelta es tirarlos.
      - name: La imagen tiene lo que el arranque necesita
        run: |
          fallos=0
          en_imagen() { docker run --rm --entrypoint sh katana/cotizador:prueba -c "$1" 2>&1; }

          probar() {
            local salida
            if salida="$(en_imagen "$1")"; then
              echo "  ✓ $2"
            else
              echo "  ✗ $2"
              echo "$salida" | sed 's/^/        /'
              fallos=$((fallos + 1))
            fi
          }

          probar "test -f /opt/prisma-cli/node_modules/prisma/build/index.js" "el CLI de Prisma"
          probar "node /opt/prisma-cli/node_modules/prisma/build/index.js --version" "el CLI arranca (carga @prisma/config, effect y empathic)"
          # NO vale con que exista UN schema-engine: el comodín `schema-engine-*`
          # daba verde teniendo dentro el de OpenSSL 1.1.x en una imagen con
          # OpenSSL 3.0, que es justo el fallo que dejó el contenedor sin
          # arrancar. Tiene que ser el de la OpenSSL de ESTA imagen, y la
          # versión se lee de la imagen en vez de escribirse a mano.
          probar "SSL=\$(openssl version | sed -E 's/^OpenSSL ([0-9]+\\.[0-9]+).*/\\1/'); ls /opt/prisma-cli/node_modules/@prisma/engines/schema-engine-*-openssl-\${SSL}.x" "el schema-engine es el de la OpenSSL de esta imagen"
          probar "test -f /app/prisma/seed.mjs" "el seed empaquetado"
          probar "test -f /app/prisma/schema.prisma" "el esquema y las migraciones"
          probar "command -v fc-cache" "fc-cache (paquete fontconfig)"
          probar "pg_dump --version | grep -q ' 16\\.'" "pg_dump 16, la misma mayor que el servidor"
          probar "test -d /app/assets/fonts && test -d /app/assets/brand" "las fuentes y el logo del documento"
          probar "test -d /ms-playwright" "Chromium"
          probar "node -e \"process.exit(require('/app/.next/required-server-files.json').config.experimental.serverActions.allowedOrigins.includes('ejemplo.invalid')?0:1)\"" "allowedOrigins con el dominio real, no localhost"

          # El seed no se puede ejecutar aquí (no hay base), pero sí comprobar
          # que Node lo carga: eso descarta que le falte una dependencia en el
          # node_modules mínimo del standalone, que es como fallaría de verdad.
          #
          # No sirve envolver el import en un .catch(): `seed.mjs` termina en
          # `main().catch(() => process.exit(1))`, así que al no haber base se
          # mata a sí mismo y el proceso muere con código 1 antes de que ese
          # catch signifique nada. La comprobación fallaba SIEMPRE, y por un
          # motivo que no tiene que ver con lo que quiere comprobar.
          #
          # Se mira la salida en vez del código: sólo un ERR_MODULE_NOT_FOUND
          # es un fallo de verdad; que Prisma no encuentre la base es lo
          # esperado aquí.
          probar "cd /app && s=\$(node --input-type=module -e 'import(\"./prisma/seed.mjs\")' 2>&1); if echo \"\$s\" | grep -q ERR_MODULE_NOT_FOUND; then echo \"\$s\"; exit 1; fi" "el seed resuelve sus imports"

          if [ "$fallos" -gt 0 ]; then
            echo ""
            echo "═══ $fallos comprobación(es) fallida(s). Diagnóstico de la imagen ═══"
            en_imagen 'echo "--- quién soy ---"; id; pwd
              echo "--- /opt/prisma-cli ---"; ls -la /opt/prisma-cli/node_modules/ | head -20
              echo "--- prisma ---"; ls -la /opt/prisma-cli/node_modules/prisma/ 2>&1 | head -10
              echo "--- @prisma ---"; ls -la /opt/prisma-cli/node_modules/@prisma/ 2>&1
              echo "--- engines ---"; ls -la /opt/prisma-cli/node_modules/@prisma/engines/ 2>&1 | head -20
              echo "--- ¿están effect y empathic? ---"; ls -d /opt/prisma-cli/node_modules/effect /opt/prisma-cli/node_modules/empathic 2>&1
              echo "--- /app/node_modules ---"; ls /app/node_modules/ 2>&1 | head -20
              echo "--- entorno ---"; env | sort' || true
            exit 1
          fi
          echo ""
          echo "Todas las comprobaciones pasan."

  imagen:
    name: Imagen
    needs: pruebas
    # Sólo se publica lo que ya pasó todas las pruebas, y sólo desde la rama
    # principal: una imagen `latest` que nadie revisó es la forma más rápida de
    # tumbar producción.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
