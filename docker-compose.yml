# ═══════════════════════════════════════════════════════════════════════════
#  Cotizador Katana Talent — despliegue de producción
#
#  NINGÚN servicio publica puertos al exterior. El acceso entra exclusivamente
#  por Cloudflare Tunnel, que abre una conexión SALIENTE hacia Cloudflare: no
#  hay que abrir 80/443 en el firewall ni gestionar certificados.
#
#  Uso:  ./deploy.sh instalar   |   ./deploy.sh actualizar
# ═══════════════════════════════════════════════════════════════════════════

services:
  db:
    image: postgres:16-alpine
    container_name: katana-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Colación determinista: evita que un cambio de locale altere los ORDER BY.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - katana_db:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768m
    networks: [katana]

  app:
    # Con `build:` presente, esto es sólo el NOMBRE que se le pone a la imagen
    # construida aquí; no se descarga de ningún registro. Las dos variables
    # existen para el día que se publique en GHCR y el servidor deje de
    # compilar: se ponen en el .env y `docker compose pull` empieza a traerla.
    image: ${APP_IMAGE:-katana/cotizador}:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # `allowedOrigins` de las Server Actions se hornea en el build: con el
        # valor equivocado mueren en cuanto Cloudflare reescriba el Host, y
        # ninguna variable de entorno lo arregla — hay que reconstruir.
        APP_PUBLIC_URL: ${APP_PUBLIC_URL}
    container_name: katana-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      PORT: 3000
      SESSION_SLIDING_HOURS: ${SESSION_SLIDING_HOURS:-12}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-168}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_NOMBRE: ${SEED_ADMIN_NOMBRE:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      STORAGE_DIR: /var/lib/katana
      PDF_CONCURRENCY: ${PDF_CONCURRENCY:-2}
      PDF_TIMEOUT_MS: ${PDF_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - katana_storage:/var/lib/katana
    # Chromium necesita más de los 64 MB por defecto de /dev/shm o se cae al
    # renderizar documentos largos.
    shm_size: '256mb'
    security_opt:
      # Un proceso comprometido no puede escalar por un binario setuid.
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # Techo total del stack ≈ 3.15 GB sobre un host de 4 GB, dejando
          # aire al kernel y a dockerd. Ojo: el `shm_size` de arriba cuenta
          # DENTRO de este límite, no fuera.
          memory: 2g
    networks: [katana]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: katana-tunnel
    restart: unless-stopped
    depends_on:
      # `service_healthy` y no `service_started`: si no, el túnel anuncia el
      # sitio y devuelve 502 mientras corren las migraciones y la siembra.
      app:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    security_opt:
      - no-new-privileges:true
    # El túnel sólo abre conexiones salientes; no necesita nada del sistema.
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [katana]

  backup:
    build:
      context: ./deploy/backup
    image: katana/backup:latest
    container_name: katana-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # Sin definir, el `set -eu` del entrypoint aborta con "TZ: unbound
      # variable" y el servicio de respaldos no arranca nunca.
      TZ: ${TZ:-America/Mexico_City}
    volumes:
      - ./respaldos:/respaldos
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
        # Media CPU: el volcado nocturno comprime, y en 2 vCPU eso compite con
        # la generación de un PDF si alguien está trabajando de madrugada.
        reservations:
          cpus: '0.25'
    networks: [katana]

volumes:
  katana_db:
  katana_storage:

networks:
  katana:
    driver: bridge
